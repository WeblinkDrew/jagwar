name: Architecture Contract

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  architecture:
    name: Architecture Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Enforce Jagwar architecture contract
        run: bun scripts/architecture/check.ts --all
